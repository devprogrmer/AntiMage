<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AntiMage</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#08121e;--panel:#102235;--line:#274259;--text:#ecf7ff;--muted:#9bb3c5;--accent:#2ddac4;--warn:#ffbe68}
html[data-theme="light"]{color-scheme:light;--bg:#edf5f7;--panel:#fff;--line:#cadde2;--text:#102b39;--muted:#526e79;--accent:#097e77;--warn:#9d5310}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px 16px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 18px}header strong{font-size:22px;letter-spacing:.2px}.brand{color:var(--accent)}select,button,input,textarea{font:inherit}select,input,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}input,textarea{width:100%;margin:6px 0 10px}textarea{min-height:90px;resize:vertical}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#153c49,#102235 70%)}html[data-theme="light"] .hero{background:linear-gradient(135deg,#d6f4ef,#fff 75%)}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.11em}h1{margin:7px 0 2px;font-size:28px}h2{font-size:18px;margin:22px 0 10px}p{margin:4px 0;color:var(--muted)}.balance{font-size:27px;font-weight:800;color:var(--text)}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.name{font-weight:700;font-size:17px}.small{font-size:13px}.pill{color:var(--accent);border:1px solid #256c66;background:#113c3b;padding:3px 8px;border-radius:30px;font-size:12px}button{cursor:pointer;background:var(--accent);color:#05202a;border:0;border-radius:10px;font-weight:700;padding:10px 14px;white-space:nowrap}button.secondary{background:#20394d;color:var(--text)}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.empty{border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted)}#notice{min-height:24px;color:var(--warn);margin:8px 0}a{color:var(--accent);overflow-wrap:anywhere}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body><main>
<header><strong><span class="brand">▲</span> AntiMage</strong><select id="language" aria-label="Language"><option value="fa">فارسی</option><option value="en">English</option><option value="ru">Русский</option></select></header>
<section class="hero"><div class="eyebrow" id="intro-label"></div><h1 id="intro-title"></h1><p id="intro-desc"></p></section>
<section class="card"><div class="row"><div><div class="eyebrow" id="wallet-label"></div><div class="balance" id="balance">—</div></div><button class="secondary" id="refresh"></button></div></section>
<div id="notice" role="status"></div><h2 id="plans-heading"></h2><div id="plans"></div><h2 id="orders-heading"></h2><div id="orders"></div><h2 id="services-heading"></h2><div id="services"></div>
<h2 id="topups-heading"></h2><section class="card"><p id="payment-instructions"></p><form id="topup-form"><label id="topup-label" for="topup-amount"></label><input id="topup-amount" type="number" min="1000" max="100000000" step="1" required><button type="submit" id="topup-submit"></button></form></section><div id="topups"></div>
<h2 id="tickets-heading"></h2><section class="card"><form id="ticket-form"><label id="ticket-label" for="ticket-message"></label><textarea id="ticket-message" maxlength="3000" required></textarea><button type="submit" id="ticket-submit"></button></form></section><div id="tickets"></div><footer>AntiMage · Telegram Mini App</footer>
</main>
<script>
(()=>{
const t={
fa:{intro:'فروشگاه و سرویس‌های شما',desc:'طرح‌ها، کیف پول و سفارش‌ها در یک جا',wallet:'موجودی کیف پول',toman:'تومان',refresh:'بروزرسانی',plans:'طرح‌ها',orders:'سفارش‌های من',services:'سرویس‌های من',emptyPlans:'فعلاً طرحی برای فروش موجود نیست.',emptyOrders:'هنوز سفارشی ندارید.',emptyServices:'هنوز سرویسی به حساب تلگرام شما وصل نشده است.',days:'روز',gb:'گیگابایت',order:'ساخت سفارش',pay:'پرداخت و فعال‌سازی',pending:'در انتظار پرداخت',paid:'در انتظار تحویل',provisioning:'در حال تحویل',completed:'تکمیل‌شده',failed:'ناموفق',retry:'تلاش دوباره برای تحویل',ready:'سرویس آماده شد: ',auth:'این صفحه را از دکمهٔ ربات در تلگرام باز کنید.',load:'بارگذاری اطلاعات ممکن نشد.',confirm:'برای این طرح سفارش ایجاد شود؟',payConfirm:'مبلغ سفارش از کیف پول کم و سرویس فعال شود؟',insufficient:'موجودی کیف پول کافی نیست.',delivery:'پرداخت ثبت شده است. تحویل را از همین سفارش دوباره امتحان کنید.',error:'درخواست انجام نشد. دوباره تلاش کنید.',status:'وضعیت',used:'مصرف',limit:'سقف حجم',subscription:'لینک اشتراک'},
en:{intro:'Your store and services',desc:'Plans, wallet and orders in one place',wallet:'Wallet balance',toman:'toman',refresh:'Refresh',plans:'Plans',orders:'My orders',services:'My services',emptyPlans:'No plans are available yet.',emptyOrders:'You have no orders yet.',emptyServices:'No services are linked to your Telegram account.',days:'days',gb:'GB',order:'Create order',pay:'Pay and activate',pending:'Awaiting payment',paid:'Awaiting delivery',provisioning:'Delivering',completed:'Completed',failed:'Failed',retry:'Retry delivery',ready:'Service ready: ',auth:'Open this page from the bot button in Telegram.',load:'Could not load your information.',confirm:'Create an order for this plan?',payConfirm:'Pay from your wallet and activate this service?',insufficient:'Your wallet balance is insufficient.',delivery:'Payment is recorded. Retry delivery from this order.',error:'Request failed. Try again.',status:'Status',used:'Used',limit:'Data limit',subscription:'Subscription link'},
ru:{intro:'Магазин и ваши услуги',desc:'Тарифы, кошелёк и заказы в одном месте',wallet:'Баланс кошелька',toman:'томан',refresh:'Обновить',plans:'Тарифы',orders:'Мои заказы',services:'Мои услуги',emptyPlans:'Пока нет доступных тарифов.',emptyOrders:'У вас пока нет заказов.',emptyServices:'К вашему аккаунту Telegram пока не привязаны услуги.',days:'дней',gb:'ГБ',order:'Создать заказ',pay:'Оплатить и активировать',pending:'Ожидает оплаты',paid:'Ожидает выдачи',provisioning:'Выдаётся',completed:'Завершён',failed:'Ошибка',retry:'Повторить выдачу',ready:'Услуга готова: ',auth:'Откройте эту страницу кнопкой бота в Telegram.',load:'Не удалось загрузить данные.',confirm:'Создать заказ на этот тариф?',payConfirm:'Оплатить из кошелька и активировать услугу?',insufficient:'Недостаточно средств в кошельке.',delivery:'Оплата записана. Повторите выдачу из этого заказа.',error:'Запрос не выполнен. Повторите попытку.',status:'Статус',used:'Использовано',limit:'Лимит',subscription:'Ссылка подписки'}};
Object.assign(t.fa,{topups:'شارژ کیف پول',topupLabel:'مبلغ شارژ (تومان)',topupSubmit:'ثبت درخواست شارژ',topupReady:'درخواست شارژ ثبت شد. رسید پرداخت را به ربات با توضیح /receipt بفرستید. شناسه: ',emptyTopups:'درخواست شارژی ندارید.',tickets:'پشتیبانی',ticketLabel:'پیام شما',ticketSubmit:'ارسال پیام پشتیبانی',ticketReady:'درخواست پشتیبانی ثبت شد: ',emptyTickets:'هنوز درخواستی ندارید.',instructions:'اطلاعات پرداخت هنوز ثبت نشده است.',receipt:'پس از پرداخت، تصویر رسید را با عنوان /receipt شناسه_درخواست برای ربات بفرستید.',view:'مشاهدهٔ گفتگو',sent:'ثبت شد',submitted:'رسید ثبت شد',approved:'تأیید شد',rejected:'رد شد'});
Object.assign(t.en,{topups:'Wallet top-ups',topupLabel:'Top-up amount (toman)',topupSubmit:'Request top-up',topupReady:'Top-up requested. Send the payment receipt photo to the bot with /receipt as its caption. ID: ',emptyTopups:'No top-up requests yet.',tickets:'Support',ticketLabel:'Your message',ticketSubmit:'Send support request',ticketReady:'Support request created: ',emptyTickets:'No support requests yet.',instructions:'Payment instructions are not configured yet.',receipt:'After payment, send a receipt photo to the bot with the caption /receipt REQUEST_ID.',view:'View conversation',sent:'Created',submitted:'Receipt submitted',approved:'Approved',rejected:'Rejected'});
Object.assign(t.ru,{topups:'Пополнение кошелька',topupLabel:'Сумма пополнения (томан)',topupSubmit:'Создать запрос',topupReady:'Запрос на пополнение создан. Отправьте фото чека боту с подписью /receipt. ID: ',emptyTopups:'Пока нет запросов на пополнение.',tickets:'Поддержка',ticketLabel:'Ваше сообщение',ticketSubmit:'Отправить запрос',ticketReady:'Запрос в поддержку создан: ',emptyTickets:'Пока нет запросов.',instructions:'Инструкции по оплате пока не настроены.',receipt:'После оплаты отправьте боту фото чека с подписью /receipt ИД_ЗАПРОСА.',view:'Открыть переписку',sent:'Создан',submitted:'Чек отправлен',approved:'Подтверждён',rejected:'Отклонён'});
const app=window.Telegram&&window.Telegram.WebApp;let lang=localStorage.getItem('antimage-mini-language')||((app&&app.initDataUnsafe&&app.initDataUnsafe.user&&app.initDataUnsafe.user.language_code)||'en').slice(0,2);if(!t[lang])lang='en';if(app&&app.colorScheme==='light')document.documentElement.dataset.theme='light';let state=null;const $=id=>document.getElementById(id),L=()=>t[lang],notice=msg=>{$('notice').textContent=msg};
function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n}
function card(){return el('article','card')}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('language').value=lang;for(const [id,key] of [['intro-label','wallet'],['intro-title','intro'],['intro-desc','desc'],['wallet-label','wallet'],['refresh','refresh'],['plans-heading','plans'],['orders-heading','orders'],['services-heading','services'],['topups-heading','topups'],['topup-label','topupLabel'],['topup-submit','topupSubmit'],['tickets-heading','tickets'],['ticket-label','ticketLabel'],['ticket-submit','ticketSubmit']])$(id).textContent=L()[key];$('balance').textContent=state?new Intl.NumberFormat(lang).format(state.balance_toman)+' '+L().toman:'—';for(const id of ['plans','orders','services','topups','tickets'])$(id).replaceChildren();if(!state)return;$('payment-instructions').textContent=state.payment_instructions||L().instructions;
const plans=state.products||[],orders=state.orders||[],services=state.services||[];
if(!plans.length)$('plans').append(el('div','empty',L().emptyPlans));for(const p of plans){const c=card(),r=el('div','row'),info=el('div');info.append(el('div','name',p.Title),el('p','small',new Intl.NumberFormat(lang).format(p.PriceToman)+' '+L().toman+' · '+p.DurationDays+' '+L().days+' · '+(p.DataLimitBytes/(1024**3)).toFixed(1)+' '+L().gb));const existing=orders.find(o=>o.ProductID===p.ID&&o.Status==='pending');const b=el('button','',existing?L().pay:L().order);b.onclick=()=>existing?pay(existing.ID,b):place(p.ID,b);r.append(info,b);c.append(r);$('plans').append(c)}
if(!orders.length)$('orders').append(el('div','empty',L().emptyOrders));for(const o of orders){const c=card(),r=el('div','row'),info=el('div');info.append(el('div','name','#'+o.ID.slice(0,8)),el('p','small',new Intl.NumberFormat(lang).format(o.PriceToman)+' '+L().toman));const pill=el('span','pill',L()[o.Status]||o.Status);r.append(info,pill);c.append(r);if(o.Username)c.append(el('p','small',o.Username));if(['pending','paid','provisioning'].includes(o.Status)){const b=el('button','',o.Status==='pending'?L().pay:L().retry);b.onclick=()=>pay(o.ID,b);const actions=el('div','actions');actions.append(b);c.append(actions)}$('orders').append(c)}
if(!services.length)$('services').append(el('div','empty',L().emptyServices));for(const s of services){const c=card();c.append(el('div','name',s.Username),el('p','small',L().status+': '+s.Status+' · '+L().used+': '+(s.UsedTraffic/(1024**3)).toFixed(2)+' '+L().gb));if(s.DataLimit)c.append(el('p','small',L().limit+': '+(s.DataLimit/(1024**3)).toFixed(1)+' '+L().gb));if(s.SubscriptionURL){try{const u=new URL(s.SubscriptionURL);if(u.protocol==='https:'||u.protocol==='http:'){const a=el('a','small',L().subscription);a.href=u.href;a.rel='noopener noreferrer';c.append(a)}}catch(e){}}$('services').append(c)}
if(!(state.topups||[]).length)$('topups').append(el('div','empty',L().emptyTopups));for(const x of state.topups||[]){const c=card();c.append(el('div','name',new Intl.NumberFormat(lang).format(x.AmountToman)+' '+L().toman),el('p','small','#'+x.ID+' · '+(L()[x.Status]||x.Status)));if(x.Status==='pending')c.append(el('p','small',L().receipt));$('topups').append(c)}
if(!(state.tickets||[]).length)$('tickets').append(el('div','empty',L().emptyTickets));for(const x of state.tickets||[]){const c=card();c.append(el('div','name','#'+x.ID.slice(0,8)),el('p','small',L().status+': '+x.Status));const b=el('button','secondary',L().view);b.onclick=async()=>{b.disabled=true;try{const detail=await request('tickets/'+x.ID);for(const m of detail.Messages||[]){const p=el('p','small',(m.Author==='admin'?'AntiMage: ':'')+m.Content);c.append(p)}b.remove()}catch(e){notice(L().error)}finally{b.disabled=false}};const actions=el('div','actions');actions.append(b);c.append(actions);$('tickets').append(c)}
}
async function request(path,body){const response=await fetch('/api/telegram-app/'+path,{method:body?'POST':'GET',headers:{'X-Telegram-Init-Data':app.initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'omit',cache:'no-store'});if(!response.ok){const e=new Error('request');e.status=response.status;throw e}return response.json()}
async function load(){if(!app||!app.initData){notice(L().auth);return}try{state=await request('state');notice('');render()}catch(e){notice(e.status===401?L().auth:L().load)}}
async function place(productID,b){if(!confirm(L().confirm))return;b.disabled=true;const keyName='antimage-mini-order-'+productID,requestKey=sessionStorage.getItem(keyName)||crypto.randomUUID();sessionStorage.setItem(keyName,requestKey);try{const order=await request('orders',{product_id:productID,request_key:requestKey});sessionStorage.removeItem(keyName);await load();document.getElementById('orders-heading').scrollIntoView({behavior:'smooth'});if(!order.ID)notice(L().error)}catch(e){notice(L().error)}finally{b.disabled=false}}
async function pay(orderID,b){if(!confirm(L().payConfirm))return;b.disabled=true;try{const result=await request('pay',{order_id:orderID});await load();notice(L().ready+result.username)}catch(e){await load();notice(e.status===409?L().insufficient:e.status===503?L().delivery:L().error)}finally{b.disabled=false}}
async function submitTopup(e){e.preventDefault();const b=$('topup-submit'),amount=Number($('topup-amount').value);if(!Number.isSafeInteger(amount)||amount<1000||amount>100000000)return;b.disabled=true;const keyName='antimage-mini-topup-'+amount,key=sessionStorage.getItem(keyName)||crypto.randomUUID();sessionStorage.setItem(keyName,key);try{const result=await request('topups',{amount_toman:amount,request_key:key});sessionStorage.removeItem(keyName);$('topup-amount').value='';await load();notice(L().topupReady+result.ID)}catch(e){notice(L().error)}finally{b.disabled=false}}
async function submitTicket(e){e.preventDefault();const b=$('ticket-submit'),message=$('ticket-message').value.trim();if(!message)return;b.disabled=true;const keyName='antimage-mini-ticket',prior=JSON.parse(sessionStorage.getItem(keyName)||'null'),key=prior&&prior.message===message?prior.key:crypto.randomUUID();sessionStorage.setItem(keyName,JSON.stringify({message,key}));try{const result=await request('tickets',{message,request_key:key});sessionStorage.removeItem(keyName);$('ticket-message').value='';await load();notice(L().ticketReady+result.ID)}catch(e){notice(L().error)}finally{b.disabled=false}}
$('language').onchange=e=>{lang=e.target.value;localStorage.setItem('antimage-mini-language',lang);render()};$('refresh').onclick=load;$('topup-form').onsubmit=submitTopup;$('ticket-form').onsubmit=submitTicket;if(app)app.ready();render();load();
})();
</script></body></html>
