name: Test Database Migrations

on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build_go_cli.sh"
      - ".github/workflows/test-db.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build_go_cli.sh"
      - ".github/workflows/test-db.yml"

jobs:
  test-databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -hlocalhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u testuser --password=testpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, mariadb]
        include:
          - db: sqlite
            url: sqlite:///./test.db

          - db: mysql
            url: mysql+pymysql://root:root@localhost:3306/testdb

          - db: mariadb
            url: mysql+pymysql://testuser:testpassword@localhost:3307/testdb

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set SQLALCHEMY_DATABASE_URL
        run: |
          echo "TEST_FROM=github" >> $GITHUB_ENV
          echo "ANTIMAGE_TEST_DATABASE_URL=${{ matrix.url }}" >> $GITHUB_ENV
          echo "SQLALCHEMY_DATABASE_URL=${{ matrix.url }}" >> $GITHUB_ENV

      - name: Verify database connection
        run: |
          go run ./cmd/antimage_cli migrate status || true

      - name: Run Go migration unit tests
        run: |
          go test ./internal/app/migrations ./cmd/antimage_cli

      - name: Run Go Migrations
        run: |
          echo "Running migrations for: ${{ matrix.db }}"
          go run ./cmd/antimage_cli migrate up
          echo "Migrations completed successfully"

      - name: Verify migration status after upgrade
        run: |
          go run ./cmd/antimage_cli migrate status

      - name: Verify database schema
        run: |
          go test ./internal/app/migrations -run TestRunMigrationsExternalDatabase

      - name: Verify runtime database queries
        if: matrix.db != 'sqlite'
        run: |
          go test ./internal/app/nodecontroller -run TestRepositoryTouchesOnlineUsersExternalMySQL

      - name: Verify portable restore preserves destination login
        if: matrix.db == 'mysql'
        env:
          ANTIMAGE_TEST_PORTABLE_MYSQL: mysql://root:root@127.0.0.1:3306/
        run: go test -race ./internal/app/backup -run '^TestPortableBackupExternalMySQL$' -count=1 -v

      - name: Verify Telegram commerce concurrency and settlement
        if: matrix.db != 'sqlite'
        env:
          ANTIMAGE_TEST_COMMERCE_DB: '1'
        run: go test ./internal/app/shop -run '^TestShopCommerceExternalMySQL$' -count=1 -v

      - name: Verify portable backup restore with a live Xray connection
        if: matrix.db == 'mysql'
        timeout-minutes: 12
        env:
          ANTIMAGE_TEST_PORTABLE_MYSQL: ${{ matrix.url }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v mysql >/dev/null || ! command -v mysqldump >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mysql-client
          fi
          fixture="$(mktemp -d "${RUNNER_TEMP}/antimage-restore-xray.XXXXXXXX")"
          archive="$fixture/Xray-linux-64.zip"
          curl --fail --location --retry 3 --output "$archive" \
            'https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip'
          echo "e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  $archive" | sha256sum --check -
          python3 -m zipfile -e "$archive" "$fixture"
          chmod +x "$fixture/xray"
          ANTIMAGE_TEST_XRAY_BINARY="$fixture/xray" \
            go test ./internal/app/backup -run '^TestPortableBackupExternalMySQL$' -count=1 -v
