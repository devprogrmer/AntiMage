name: Build-dev

on:
  push:
    branches:
      - 'dev'

permissions:
  contents: read
  packages: write

jobs:
  build-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASH_DIR: ./dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.DASH_DIR }}/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Install dependencies
        working-directory: ${{ env.DASH_DIR }}
        run: npm ci

      - name: Test dashboard
        working-directory: ${{ env.DASH_DIR }}
        run: npm test

      - name: Lint dashboard
        working-directory: ${{ env.DASH_DIR }}
        run: npm run lint

      - name: Build project
        run: bash scripts/build_dashboard.sh

      - name: Install pinned Xray for E2E
        shell: bash
        run: |
          set -euo pipefail

          XRAY_VERSION="v26.7.11"
          XRAY_SHA256="aa11c3685c71da0ffc71e511db50404609e7e963bb914b048f59a6a00af8930e"
          XRAY_ARCHIVE="${RUNNER_TEMP}/Xray-linux-64-${XRAY_VERSION}.zip"
          XRAY_DIR="${RUNNER_TEMP}/antimage-xray-e2e-${XRAY_VERSION}"

          curl --fail --location --retry 3 --retry-delay 2 \
            --output "${XRAY_ARCHIVE}" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"

          echo "${XRAY_SHA256}  ${XRAY_ARCHIVE}" | sha256sum --check -

          rm -rf "${XRAY_DIR}"
          mkdir -p "${XRAY_DIR}"

          python3 -m zipfile -e "${XRAY_ARCHIVE}" "${XRAY_DIR}"
          chmod +x "${XRAY_DIR}/xray"

          "${XRAY_DIR}/xray" -version

          echo "ANTIMAGE_XRAY_E2E_BINARY=${XRAY_DIR}/xray" >> "${GITHUB_ENV}"
      - name: Verify Go suites
        run: go test -p 1 -buildvcs=false ./cmd/... ./internal/...

      - name: Verify Go race detector
        env:
          ANTIMAGE_XRAY_E2E_BINARY: ""
        run: go test -race -timeout 30m -p 1 -buildvcs=false ./internal/...

      - name: Verify product naming
        shell: pwsh
        run: ./scripts/verify_release_names.ps1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: image_tags
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antimage:${GITHUB_REF_NAME}"
          dockerhub_enabled=false
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            dockerhub_enabled=true
            tags="${tags}"$'\n'"${DOCKERHUB_USERNAME}/antimage:${GITHUB_REF_NAME}"
          fi
          echo "dockerhub_enabled=${dockerhub_enabled}" >> "${GITHUB_OUTPUT}"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        id: dockerhub_login
        if: steps.image_tags.outputs.dockerhub_enabled == 'true'
        continue-on-error: true
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Finalize image tags
        id: final_image_tags
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          tags="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antimage:${GITHUB_REF_NAME}"
          node_tags="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/antimage-node:${GITHUB_REF_NAME}"
          if [[ "${{ steps.dockerhub_login.outcome }}" == "success" ]]; then
            tags="${tags}"$'\n'"${DOCKERHUB_USERNAME}/antimage:${GITHUB_REF_NAME}"
            node_tags="${node_tags}"$'\n'"${DOCKERHUB_USERNAME}/antimage-node:${GITHUB_REF_NAME}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
            echo "node_tags<<EOF"
            echo "${node_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.final_image_tags.outputs.tags }}

      - name: Build and push node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64
          push: true
          tags: ${{ steps.final_image_tags.outputs.node_tags }}
