name: Phase C WireGuard E2E

on:
  pull_request:
    branches:
      - codex/antimage-next-phase-b
    paths:
      - "cmd/antimage_gateway/**"
      - "cmd/antimage_node/**"
      - "internal/app/api/**"
      - "internal/app/migrations/**"
      - "internal/app/nodeagent/**"
      - "internal/app/nodecontroller/**"
      - "internal/app/user/**"
      - "internal/app/xrayconfig/**"
      - "internal/platform/db/**"
      - "internal/proto/node/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/phase-c-wireguard-e2e.yml"
  push:
    branches:
      - codex/antimage-phase-c-access-policy
    paths:
      - "cmd/antimage_gateway/**"
      - "cmd/antimage_node/**"
      - "internal/app/api/**"
      - "internal/app/migrations/**"
      - "internal/app/nodeagent/**"
      - "internal/app/nodecontroller/**"
      - "internal/app/user/**"
      - "internal/app/xrayconfig/**"
      - "internal/platform/db/**"
      - "internal/proto/node/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/phase-c-wireguard-e2e.yml"

permissions:
  contents: read

jobs:
  phase-c-wireguard-e2e:
    name: phase-c-wireguard-e2e (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [auto, userspace]
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install isolated WireGuard runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 wireguard-tools wireguard-go
          sudo modprobe wireguard || true
          ip -Version
          wg --version
          wireguard-go --version || true
          test -c /dev/net/tun

      - name: Build production Panel and Node executables
        run: |
          set -euo pipefail
          git rev-parse HEAD
          mkdir -p "$RUNNER_TEMP/phase-c-e2e"
          go build -buildvcs=false -o "$RUNNER_TEMP/phase-c-e2e/antimage-panel" ./cmd/antimage_gateway
          go build -buildvcs=false -o "$RUNNER_TEMP/phase-c-e2e/antimage-node" ./cmd/antimage_node

      - name: Run real Panel, TLS/gRPC Node, and WireGuard revoke E2E
        env:
          ANTIMAGE_PHASE_C_WG_E2E: "1"
          ANTIMAGE_E2E_WIREGUARD_BACKEND: ${{ matrix.backend }}
          ANTIMAGE_E2E_PANEL_BIN: ${{ runner.temp }}/phase-c-e2e/antimage-panel
          ANTIMAGE_E2E_NODE_BIN: ${{ runner.temp }}/phase-c-e2e/antimage-node
          ANTIMAGE_E2E_WIREGUARD_GO_BIN: /usr/bin/wireguard-go
        run: |
          set -euo pipefail
          GO_BIN="$(command -v go)"
          if sudo -n unshare --net --mount bash -euc 'mount --make-rprivate /; mount -t sysfs sysfs /sys' 2>/dev/null; then
            echo "Running the E2E in an isolated network namespace"
            sudo -n env PATH="$PATH" \
              GO_BIN="$GO_BIN" \
              CGO_ENABLED=1 \
              GOCACHE="$(go env GOCACHE)" \
              GOMODCACHE="$(go env GOMODCACHE)" \
              ANTIMAGE_PHASE_C_WG_E2E="$ANTIMAGE_PHASE_C_WG_E2E" \
              ANTIMAGE_E2E_WIREGUARD_BACKEND="$ANTIMAGE_E2E_WIREGUARD_BACKEND" \
              ANTIMAGE_E2E_PANEL_BIN="$ANTIMAGE_E2E_PANEL_BIN" \
              ANTIMAGE_E2E_NODE_BIN="$ANTIMAGE_E2E_NODE_BIN" \
              ANTIMAGE_E2E_WIREGUARD_GO_BIN="$ANTIMAGE_E2E_WIREGUARD_GO_BIN" \
              unshare --net --mount bash -euc 'mount --make-rprivate /; mount -t sysfs sysfs /sys; ip link set lo up; exec "$GO_BIN" test -tags=phasec_e2e ./internal/app/api -run "^TestPhaseC(WireGuardE2E|EvidenceRedaction)$" -count=1 -timeout=6m -v' \
              2>&1 | tee "$RUNNER_TEMP/phase-c-wireguard-e2e.log"
          else
            echo "Network namespace unavailable; using unique temporary interface and runner ports"
            sudo -n env PATH="$PATH" \
              CGO_ENABLED=1 \
              GOCACHE="$(go env GOCACHE)" \
              GOMODCACHE="$(go env GOMODCACHE)" \
              ANTIMAGE_PHASE_C_WG_E2E="$ANTIMAGE_PHASE_C_WG_E2E" \
              ANTIMAGE_E2E_WIREGUARD_BACKEND="$ANTIMAGE_E2E_WIREGUARD_BACKEND" \
              ANTIMAGE_E2E_PANEL_BIN="$ANTIMAGE_E2E_PANEL_BIN" \
              ANTIMAGE_E2E_NODE_BIN="$ANTIMAGE_E2E_NODE_BIN" \
              ANTIMAGE_E2E_WIREGUARD_GO_BIN="$ANTIMAGE_E2E_WIREGUARD_GO_BIN" \
              "$GO_BIN" test -tags=phasec_e2e ./internal/app/api \
              -run '^TestPhaseC(WireGuardE2E|EvidenceRedaction)$' -count=1 -timeout=6m -v \
              2>&1 | tee "$RUNNER_TEMP/phase-c-wireguard-e2e.log"
          fi

      - name: Upload sanitized E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-wireguard-e2e-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/phase-c-wireguard-e2e.log
          if-no-files-found: ignore
