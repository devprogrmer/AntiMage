name: Network Intelligence Isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/app/networkintelligence/**'
      - 'internal/app/api/network_intelligence*'
      - 'internal/app/api/network_history*'
      - 'internal/app/nodeagent/network_intelligence*'
      - 'internal/app/nodecontroller/network_intelligence*'
      - 'internal/app/nodecontroller/network_history*'
      - 'dashboard/src/**/Network*'
      - 'dashboard/src/service/networkIntelligence*'
      - 'dashboard/e2e/network-intelligence.spec.ts'
      - 'dashboard/e2e/network-intelligence-live.mjs'
      - 'dashboard/playwright.config.ts'
      - 'dashboard/package*.json'
      - 'scripts/ci/network-intelligence-e2e.sh'
      - 'scripts/ci/native-linux-guest.sh'
      - '.github/workflows/network-intelligence.yml'

permissions:
  contents: read

jobs:
  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Browser reads durable history from authenticated panel
        working-directory: .
        env:
          ANTIMAGE_NI_BROWSER_DASHBOARD: ${{ github.workspace }}/dashboard
        run: go test ./internal/app/api -run '^TestNetworkHistoryWorkerPersistsThroughMTLSAndDatabaseReopen$' -count=1

  isolated-wireguard:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the dashboard for the disposable guest
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Install disposable guest tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Build race test binaries and validate guest cleanup
        run: |
          python3 scripts/ci/test-native-linux-guest.py
          go test -race -c -o "$RUNNER_TEMP/networkintelligence.test" ./internal/app/networkintelligence
          go test -c -o "$RUNNER_TEMP/networkintelligence-resource.test" ./internal/app/networkintelligence
          go test -race -c -o "$RUNNER_TEMP/nodeagent.test" ./internal/app/nodeagent
          go test -race -c -o "$RUNNER_TEMP/api.test" ./internal/app/api
      - name: Real WireGuard reassignment in disposable Linux guest
        run: |
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            ANTIMAGE_NI_TEST_BINARY="$RUNNER_TEMP/networkintelligence.test" \
            ANTIMAGE_NI_RESOURCE_TEST_BINARY="$RUNNER_TEMP/networkintelligence-resource.test" \
            ANTIMAGE_NI_NODE_TEST_BINARY="$RUNNER_TEMP/nodeagent.test" \
            ANTIMAGE_NI_API_TEST_BINARY="$RUNNER_TEMP/api.test" \
            ANTIMAGE_NI_NODE_BINARY="$(command -v node)" \
            bash scripts/ci/native-linux-guest.sh network-intelligence
      - name: Retain isolated guest evidence and resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-intelligence-guest-evidence
          path: ${{ runner.temp }}/antimage-guest-failure/
