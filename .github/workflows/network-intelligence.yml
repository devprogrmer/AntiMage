name: Network Intelligence Isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/app/networkintelligence/**'
      - 'internal/app/api/network_intelligence*'
      - 'internal/app/api/network_history*'
      - 'internal/app/nodeagent/network_intelligence*'
      - 'internal/app/nodecontroller/network_intelligence*'
      - 'internal/app/nodecontroller/network_history*'
      - 'dashboard/src/**/Network*'
      - 'dashboard/src/service/networkIntelligence*'
      - 'dashboard/e2e/network-intelligence.spec.ts'
      - 'dashboard/e2e/network-intelligence-*.mjs'
      - 'dashboard/playwright.config.ts'
      - 'dashboard/package*.json'
      - 'scripts/ci/network-intelligence-e2e.sh'
      - 'scripts/ci/native-linux-guest.sh'
      - '.github/workflows/network-intelligence.yml'

permissions:
  contents: read

jobs:
  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Browser reads durable history from authenticated panel
        working-directory: .
        env:
          ANTIMAGE_NI_BROWSER_DASHBOARD: ${{ github.workspace }}/dashboard
        run: go test ./internal/app/api -run '^TestNetworkHistoryWorkerPersistsThroughMTLSAndDatabaseReopen$' -count=1

      - name: Build actual baseline and current binaries for isolated recovery
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          baseline=1c1dd80f693d5ea760a088241e2705e5be49420b
          lab="$RUNNER_TEMP/ni-recovery"
          mkdir -p "$lab/source" "$lab/evidence"
          git cat-file -e "$baseline^{commit}"
          git archive "$baseline" | tar -x -C "$lab/source"
          (
            cd "$lab/source"
            go build -buildvcs=false -o "$lab/baseline-node" ./cmd/antimage_node
            go build -buildvcs=false -o "$lab/baseline-panel" ./cmd/antimage_gateway
          )
          go build -buildvcs=false -o "$lab/current-node" ./cmd/antimage_node
          go build -buildvcs=false -o "$lab/current-panel" ./cmd/antimage_gateway
          go test -race -c -o "$lab/node-recovery.test" ./internal/app/nodeagent
          sha256sum "$lab/"{baseline,current}-{node,panel} > "$lab/evidence/SHA256SUMS"
          printf 'baseline=%s\ncurrent=%s\n' "$baseline" "$(git rev-parse HEAD)" > "$lab/evidence/source-shas.txt"
          {
            echo "ANTIMAGE_NI_BASELINE_NODE=$lab/baseline-node"
            echo "ANTIMAGE_NI_CURRENT_NODE=$lab/current-node"
            echo "ANTIMAGE_NI_BASELINE_PANEL=$lab/baseline-panel"
            echo "ANTIMAGE_NI_CURRENT_PANEL=$lab/current-panel"
            echo "ANTIMAGE_NI_NODE_TEST_BINARY=$lab/node-recovery.test"
            echo "ANTIMAGE_NI_LOCAL_DASHBOARD=$GITHUB_WORKSPACE/dashboard"
          } >> "$GITHUB_ENV"

      - name: Real Linux process, binary, backup and browser recovery
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v ./internal/app/nodeagent \
            -run '^TestNetworkIntelligence(LocalTrafficToAuthenticatedPanel|ProcessRecoveryAndVersionRollback)$' -count=1 \
            | tee "$RUNNER_TEMP/ni-recovery/evidence/node-recovery.log"
          go test -race -v ./internal/app/api \
            -run '^TestNetworkIntelligence(PanelRestartBackupAndFlagRollback|PanelBinaryVersionRollback|BrowserRecoversFromNodeFailures)$' -count=1 \
            | tee "$RUNNER_TEMP/ni-recovery/evidence/panel-recovery.log"

      - name: Retain Linux staging recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-intelligence-linux-recovery
          path: ${{ runner.temp }}/ni-recovery/evidence/
          retention-days: 14

  isolated-wireguard:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the dashboard for the disposable guest
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Install disposable guest tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Build race test binaries and validate guest cleanup
        run: |
          python3 scripts/ci/test-native-linux-guest.py
          go test -race -c -o "$RUNNER_TEMP/networkintelligence.test" ./internal/app/networkintelligence
          go test -c -o "$RUNNER_TEMP/networkintelligence-resource.test" ./internal/app/networkintelligence
          go test -race -c -o "$RUNNER_TEMP/nodeagent.test" ./internal/app/nodeagent
          go test -c -o "$RUNNER_TEMP/nodeagent-resource.test" ./internal/app/nodeagent
          go test -race -c -o "$RUNNER_TEMP/api.test" ./internal/app/api
      - name: Real WireGuard reassignment in disposable Linux guest
        run: |
          sudo env RUNNER_TEMP="$RUNNER_TEMP" \
            ANTIMAGE_NI_TEST_BINARY="$RUNNER_TEMP/networkintelligence.test" \
            ANTIMAGE_NI_RESOURCE_TEST_BINARY="$RUNNER_TEMP/networkintelligence-resource.test" \
            ANTIMAGE_NI_NODE_TEST_BINARY="$RUNNER_TEMP/nodeagent.test" \
            ANTIMAGE_NI_NODE_RESOURCE_TEST_BINARY="$RUNNER_TEMP/nodeagent-resource.test" \
            ANTIMAGE_NI_API_TEST_BINARY="$RUNNER_TEMP/api.test" \
            ANTIMAGE_NI_NODE_BINARY="$(command -v node)" \
            bash scripts/ci/native-linux-guest.sh network-intelligence
      - name: Summarize collector CPU and allocation profiles
        if: always()
        run: |
          for profile in "$RUNNER_TEMP/antimage-guest-failure/"*.pprof; do
            [ -f "$profile" ] || continue
            go tool pprof -top "$RUNNER_TEMP/nodeagent-resource.test" "$profile" > "$RUNNER_TEMP/$(basename "$profile").top.txt"
          done
      - name: Retain isolated guest evidence and resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-intelligence-guest-evidence
          path: |
            ${{ runner.temp }}/antimage-guest-failure/
            ${{ runner.temp }}/*.pprof.top.txt
