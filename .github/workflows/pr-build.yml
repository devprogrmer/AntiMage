name: PR Build

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DASH_DIR: ./dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.DASH_DIR }}/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install dashboard dependencies
        working-directory: ${{ env.DASH_DIR }}
        run: npm ci

      - name: Test dashboard
        working-directory: ${{ env.DASH_DIR }}
        run: npm test

      - name: Lint dashboard
        working-directory: ${{ env.DASH_DIR }}
        run: npm run lint

      - name: Build dashboard
        run: bash scripts/build_dashboard.sh

      - name: Install pinned Xray for E2E
        shell: bash
        run: |
          set -euo pipefail

          XRAY_DIR="${RUNNER_TEMP}/antimage-xray-e2e-26.10.31"
          XRAY_IMAGE="ghcr.io/xtls/xray-core@sha256:db94b52238af7311f30044a1ef64e77b0edf285a302c276a7f4d7b368e6a17ab"
          mkdir -p "${XRAY_DIR}"
          docker pull --platform linux/amd64 "${XRAY_IMAGE}"
          XRAY_CONTAINER="$(docker create --platform linux/amd64 "${XRAY_IMAGE}")"
          trap 'docker rm -f "${XRAY_CONTAINER}" >/dev/null 2>&1 || true' EXIT
          docker cp "${XRAY_CONTAINER}:/usr/local/bin/xray" "${XRAY_DIR}/xray"
          chmod +x "${XRAY_DIR}/xray"

          "${XRAY_DIR}/xray" -version

          echo "ANTIMAGE_XRAY_E2E_BINARY=${XRAY_DIR}/xray" >> "${GITHUB_ENV}"
      - name: Verify Go suites
        run: go test -p 1 -buildvcs=false ./cmd/... ./internal/...

      - name: Verify Go race detector
        env:
          ANTIMAGE_XRAY_E2E_BINARY: ""
        run: go test -race -timeout 30m -p 1 -buildvcs=false ./internal/...

      - name: Verify product naming
        shell: pwsh
        run: ./scripts/verify_release_names.ps1

      - name: Verify node installer provisioning
        run: |
          bash scripts/antimage/test-node-installer.sh
          python3 scripts/ci/test-panel-cli-availability.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            devprogrmer/antimage:pr-${{ github.event.pull_request.number }}
            ghcr.io/devprogrmer/antimage:pr-${{ github.event.pull_request.number }}

      - name: Build Docker node image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64
          push: false
          tags: |
            devprogrmer/antimage-node:pr-${{ github.event.pull_request.number }}
            ghcr.io/devprogrmer/antimage-node:pr-${{ github.event.pull_request.number }}
